name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.9.27
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: docker build --tag langgraph-resilient-agent:${{ github.sha }} .

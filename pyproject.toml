[project]
name = "langgraph-resilient-agent"
version = "0.1.0"
description = "A durable LangGraph agent with human approval, idempotent tools, and an auditable FastAPI boundary."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Adrien" }]
dependencies = [
  "fastapi==0.141.1",
  "langgraph==1.2.10",
  "langgraph-checkpoint-sqlite==3.1.0",
  "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.14.14",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resilient_agent"]

[tool.pytest.ini_options]
addopts = "-q --cov=resilient_agent --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["resilient_agent"]
